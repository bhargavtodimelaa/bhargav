<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live TV - Premium Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #7C3AED;
  --primary-light: #A78BFA;
  --primary-dark: #5B21B6;
  --primary-glow: rgba(124, 58, 237, 0.4);
  --secondary: #EC4899;
  --accent: #06B6D4;
  --bg-primary: #0F0A1A;
  --bg-secondary: #1A1225;
  --bg-card: rgba(255, 255, 255, 0.03);
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-hover: rgba(124, 58, 237, 0.3);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  --text-primary: #FFFFFF;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-tertiary: rgba(255, 255, 255, 0.4);
  --radius: 20px;
  --radius-sm: 12px;
  --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  background: var(--bg-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-primary);
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  background-image: 
    radial-gradient(ellipse at 0% 0%, rgba(124, 58, 237, 0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 100% 100%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 70%);
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 4px;
  height: 4px;
}
::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.02);
}
::-webkit-scrollbar-thumb {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 10px;
}

/* Header - Premium */
.header {
  background: rgba(15, 10, 26, 0.85);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--glass-border);
  position: sticky;
  top: 0;
  z-index: 100;
  animation: slideDown 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideDown {
  from { transform: translateY(-100%) scale(0.95); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-brand .logo-icon {
  position: relative;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: var(--radius-sm);
  box-shadow: 0 4px 20px var(--primary-glow);
}

.header-brand .logo-icon .material-symbols-outlined {
  font-size: 28px;
  color: #fff;
  animation: pulseIcon 2s ease-in-out infinite;
}

@keyframes pulseIcon {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.1) rotate(-5deg); }
}

.header-brand .logo-text {
  display: flex;
  flex-direction: column;
}

.header-brand .logo-text .title {
  font-size: 1.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 30%, var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.header-brand .logo-text .subtitle {
  font-size: 0.6rem;
  font-weight: 400;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: -2px;
}

.header .counter {
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  padding: 8px 22px;
  border-radius: 50px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-secondary);
  border: 1px solid var(--glass-border);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header .counter .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

/* Filter Bar - Glass */
.filter-bar {
  background: rgba(15, 10, 26, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 12px 32px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 20px;
  border-bottom: 1px solid var(--glass-border);
  position: sticky;
  top: 72px;
  z-index: 99;
  animation: slideDown 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.1s both;
}

.filter-bar .search {
  flex: 1 1 200px;
  display: flex;
  align-items: center;
  background: var(--glass-bg);
  border-radius: 50px;
  padding: 6px 20px 6px 24px;
  border: 1px solid var(--glass-border);
  transition: var(--transition);
  position: relative;
}

.filter-bar .search:focus-within {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-glow), inset 0 0 20px rgba(124, 58, 237, 0.05);
}

.filter-bar .search .material-symbols-outlined {
  font-size: 20px;
  color: var(--text-secondary);
  margin-right: 12px;
  transition: var(--transition);
}

.filter-bar .search:focus-within .material-symbols-outlined {
  color: var(--primary-light);
}

.filter-bar input {
  flex: 1;
  background: transparent;
  border: none;
  padding: 10px 4px;
  font-size: 0.9rem;
  font-family: inherit;
  color: var(--text-primary);
  outline: none;
  min-width: 80px;
}

.filter-bar input::placeholder {
  color: var(--text-tertiary);
  font-weight: 300;
}

.filter-bar .cats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-bar .cat {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  color: var(--text-secondary);
  padding: 6px 20px;
  border-radius: 50px;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  text-transform: capitalize;
  font-family: inherit;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.filter-bar .cat::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
  transition: var(--transition);
}

.filter-bar .cat:hover::before {
  left: 100%;
}

.filter-bar .cat:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateY(-2px);
  border-color: var(--glass-border-hover);
}

.filter-bar .cat.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 4px 25px var(--primary-glow);
  transform: translateY(-2px);
}

/* Recently Played - Premium */
.last-section {
  padding: 24px 32px 8px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
  display: none;
  animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.last-section.visible {
  display: block;
}

.last-section .title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.last-section .title .badge {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 2px 12px;
  border-radius: 50px;
  font-size: 0.6rem;
  color: #fff;
  font-weight: 700;
}

.last-grid {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 16px;
  scroll-behavior: smooth;
}

.last-grid::-webkit-scrollbar {
  height: 3px;
}

.last-grid::-webkit-scrollbar-thumb {
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 10px;
}

.last-card {
  flex: 0 0 130px;
  background: var(--glass-bg);
  backdrop-filter: blur(15px);
  border-radius: var(--radius);
  padding: 16px 12px;
  border: 1px solid var(--glass-border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  min-width: 110px;
  transition: var(--transition);
  animation: cardSlide 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
  position: relative;
  overflow: hidden;
}

@keyframes cardSlide {
  from { opacity: 0; transform: translateX(-20px) scale(0.9); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

.last-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(124, 58, 237, 0.05), transparent 70%);
  opacity: 0;
  transition: var(--transition);
}

.last-card:hover::before {
  opacity: 1;
}

.last-card:hover {
  transform: translateY(-8px) scale(1.03);
  border-color: var(--primary);
  box-shadow: 0 12px 40px rgba(124, 58, 237, 0.2);
}

.last-card .lp-logo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--glass-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 2px solid var(--glass-border);
  margin-bottom: 10px;
  transition: var(--transition);
  position: relative;
  z-index: 1;
}

.last-card:hover .lp-logo {
  border-color: var(--primary);
  transform: scale(1.1);
  box-shadow: 0 0 30px var(--primary-glow);
}

.last-card .lp-logo img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  padding: 5px;
}

.last-card .lp-name {
  font-size: 0.75rem;
  font-weight: 500;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.3;
  max-height: 2.6em;
  position: relative;
  z-index: 1;
}

.last-card .lp-badge {
  font-size: 0.5rem;
  color: var(--primary-light);
  background: var(--primary-glow);
  padding: 2px 14px;
  border-radius: 50px;
  margin-top: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  position: relative;
  z-index: 1;
  border: 1px solid rgba(124, 58, 237, 0.2);
}

/* Channel Grid - Premium */
.grid {
  padding: 20px 32px 40px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 24px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

.ch-card {
  background: var(--glass-bg);
  backdrop-filter: blur(15px);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--glass-border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 24px 16px 20px;
  transition: var(--transition);
  animation: cardSlide 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
  position: relative;
}

.ch-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.05), rgba(236, 72, 153, 0.02));
  opacity: 0;
  transition: var(--transition);
}

.ch-card::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 50% 50%, rgba(124, 58, 237, 0.03), transparent 70%);
  opacity: 0;
  transition: var(--transition);
  pointer-events: none;
}

.ch-card:hover::before {
  opacity: 1;
}

.ch-card:hover::after {
  opacity: 1;
}

.ch-card:hover {
  transform: translateY(-10px) scale(1.02);
  border-color: var(--primary);
  box-shadow: 0 16px 60px rgba(124, 58, 237, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.ch-card .logo {
  width: 84px;
  height: 84px;
  background: var(--glass-bg);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  overflow: hidden;
  border: 2px solid var(--glass-border);
  flex-shrink: 0;
  transition: var(--transition);
  position: relative;
  z-index: 1;
}

.ch-card:hover .logo {
  border-color: var(--primary);
  transform: scale(1.08) rotate(-3deg);
  box-shadow: 0 0 40px var(--primary-glow);
}

.ch-card img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  padding: 10px;
  transition: var(--transition);
}

.ch-card:hover img {
  transform: scale(1.05);
}

.ch-card .name {
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  max-height: 2.6em;
  position: relative;
  z-index: 1;
}

.ch-card .cat {
  font-size: 0.6rem;
  color: var(--text-secondary);
  margin-top: 8px;
  background: var(--glass-bg);
  padding: 4px 16px;
  border-radius: 50px;
  display: inline-block;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border: 1px solid var(--glass-border);
  position: relative;
  z-index: 1;
  transition: var(--transition);
}

.ch-card:hover .cat {
  border-color: var(--primary);
  color: var(--text-primary);
}

.ch-card .play-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: var(--transition);
  z-index: 2;
  box-shadow: 0 0 60px var(--primary-glow);
}

.ch-card:hover .play-overlay {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.ch-card .play-overlay .material-symbols-outlined {
  font-size: 32px;
  color: #fff;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-secondary);
  background: var(--glass-bg);
  backdrop-filter: blur(15px);
  border-radius: var(--radius);
  border: 1px dashed var(--glass-border);
}

.empty .material-symbols-outlined {
  font-size: 4.5rem;
  color: var(--text-tertiary);
  display: block;
  margin-bottom: 16px;
}

/* Player - Cinematic with Brightness Fix */
.player {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  z-index: 1000;
  flex-direction: column;
  animation: playerIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes playerIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.player.active {
  display: flex;
}

#pc {
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Remove dark overlay that was reducing brightness */
#pc::after {
  display: none;
}

#video {
  width: 100%;
  height: 100%;
  max-height: 100vh;
  background: #000;
  /* Ensure video is bright */
  filter: brightness(1) contrast(1.05);
}

/* Player Controls - Premium with Auto-Hide */
.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 24px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
  z-index: 1001;
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.top-bar > * {
  pointer-events: auto;
}

/* Auto-hide controls */
.top-bar.hidden {
  opacity: 0;
  transform: translateY(-20px);
  pointer-events: none;
}

.pbtn {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  color: #fff;
  padding: 10px 24px;
  border-radius: 50px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: var(--transition);
}

.pbtn:hover {
  background: rgba(255, 255, 255, 0.12);
  transform: translateY(-2px) scale(1.02);
  border-color: var(--primary);
}

.pbtn .material-symbols-outlined {
  font-size: 22px;
}

.pclose {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
}

.pclose:hover {
  background: rgba(239, 68, 68, 0.3);
  border-color: #EF4444;
  transform: rotate(90deg) scale(1.1);
}

.pclose .material-symbols-outlined {
  font-size: 28px;
}

.pinfo {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--glass-bg);
  backdrop-filter: blur(30px);
  padding: 10px 28px 10px 18px;
  border-radius: 60px;
  border: 1px solid var(--glass-border);
  color: #fff;
  font-size: 0.9rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--glass-shadow), 0 0 40px rgba(124, 58, 237, 0.1);
  pointer-events: none;
  white-space: nowrap;
  animation: infoSlide 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

@keyframes infoSlide {
  from { opacity: 0; transform: translateX(-50%) translateY(30px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.pinfo.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(20px);
  pointer-events: none;
}

.pinfo img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--glass-bg);
  padding: 5px;
  border: 1px solid var(--glass-border);
}

.pinfo .pname {
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pinfo .live-badge {
  background: linear-gradient(135deg, #EF4444, #DC2626);
  padding: 2px 12px;
  border-radius: 50px;
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  animation: livePulse 1.5s ease-in-out infinite;
}

@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Error - Premium */
.err {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(20px);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.err.active {
  display: flex;
}

.err-modal {
  background: var(--glass-bg);
  backdrop-filter: blur(40px);
  border-radius: 32px;
  padding: 48px 36px 36px;
  max-width: 440px;
  width: 90%;
  text-align: center;
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  animation: modalIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.8) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.err-modal .material-symbols-outlined {
  font-size: 4rem;
  color: #EF4444;
  margin-bottom: 16px;
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-10deg); }
  75% { transform: rotate(10deg); }
}

.err-modal h2 {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 10px;
}

.err-modal p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 28px;
}

.err-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.ebtn {
  padding: 12px 36px;
  border-radius: 50px;
  border: none;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: var(--transition);
}

.ebtn.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 4px 25px var(--primary-glow);
}

.ebtn.primary:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 40px var(--primary-glow);
}

.ebtn.secondary {
  background: var(--glass-bg);
  color: var(--text-primary);
  border: 1px solid var(--glass-border);
}

.ebtn.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateY(-3px);
}

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .header-brand .logo-text .title { font-size: 1.1rem; }
  .header-brand .logo-icon { width: 32px; height: 32px; }
  .header-brand .logo-icon .material-symbols-outlined { font-size: 22px; }
  .filter-bar { padding: 10px 16px; top: 60px; }
  .filter-bar .search { padding: 4px 16px; }
  .grid { padding: 16px 16px 24px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
  .ch-card .logo { width: 64px; height: 64px; }
  .ch-card { padding: 18px 12px 16px; }
  .pinfo { bottom: 80px; font-size: 0.8rem; padding: 8px 18px 8px 12px; }
  .pinfo img { width: 28px; height: 28px; }
  .pbtn { padding: 8px 16px; font-size: 0.75rem; }
  .last-card { flex: 0 0 110px; min-width: 90px; padding: 12px 8px; }
  .last-card .lp-logo { width: 48px; height: 48px; }
  .last-section { padding: 16px 16px 4px; }
  .top-bar { padding: 16px; }
}

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 12px 12px 20px; }
  .ch-card .logo { width: 56px; height: 56px; }
  .ch-card .name { font-size: 0.75rem; }
  .ch-card { padding: 14px 8px 12px; }
  .filter-bar .cat { font-size: 0.65rem; padding: 4px 14px; }
  .pinfo { bottom: 60px; font-size: 0.7rem; padding: 6px 14px 6px 10px; }
  .pinfo img { width: 22px; height: 22px; }
  .pbtn { padding: 6px 12px; font-size: 0.7rem; }
  .pbtn .material-symbols-outlined { font-size: 18px; }
  .pclose { width: 40px; height: 40px; }
  .pclose .material-symbols-outlined { font-size: 22px; }
  .header-brand .logo-text .subtitle { display: none; }
  .header .counter { font-size: 0.65rem; padding: 6px 14px; }
  .last-card { flex: 0 0 90px; min-width: 70px; padding: 10px 6px; }
  .last-card .lp-logo { width: 40px; height: 40px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="logo-icon">
      <span class="material-symbols-outlined">live_tv</span>
    </div>
    <div class="logo-text">
      <span class="title">Live TV</span>
      <span class="subtitle">Premium Streaming</span>
    </div>
  </div>
  <span class="counter">
    <span class="dot"></span>
    <span id="counter">0 channels</span>
  </span>
</header>

<div class="filter-bar">
  <div class="search">
    <span class="material-symbols-outlined">search</span>
    <input type="text" id="search" placeholder="Search channels...">
  </div>
  <div class="cats" id="cats"></div>
</div>

<div class="last-section" id="lastSection">
  <div class="title">
    ⏱️ Recently played
    <span class="badge">RECENT</span>
  </div>
  <div class="last-grid" id="lastGrid"></div>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
  <div class="top-bar" id="topBar">
    <button class="pbtn" id="back">
      <span class="material-symbols-outlined">arrow_back</span> Back
    </button>
    <button class="pclose" id="close">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <div id="pc">
    <video id="video" controls playsinline autoplay></video>
  </div>
  <div class="pinfo" id="pinfo">
    <img id="plogo" src="" alt="logo">
    <span class="pname" id="pname">Channel</span>
    <span class="live-badge">● LIVE</span>
  </div>
</div>

<div class="err" id="err">
  <div class="err-modal">
    <span class="material-symbols-outlined">error</span>
    <h2>Connection Lost</h2>
    <p>This channel is currently unavailable. Please check your connection and try again.</p>
    <div class="err-actions">
      <button class="ebtn primary" id="retry">Retry Now</button>
      <button class="ebtn secondary" id="errclose">Close</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'P'].includes(e.key)) { e.preventDefault(); return false; }
  if (e.ctrlKey && ['u', 'U', 's', 'S'].includes(e.key)) { e.preventDefault(); return false; }
});

let allChannels = [];
let filteredChannels = [];
let currentCategory = 'All';
let searchTerm = '';
let cachedCookie = null;
let cookieTimestamp = 0;
const COOKIE_MAX_AGE = 5 * 60 * 1000;
let activeCookie = null;
let isClosing = false;
let shakaPlayer = null;
let currentChannel = null;
let errorChannel = null;
let isErrorShowing = false;
let lastPlayedChannels = [];
let isPlaying = false;
let playTimeout = null;
const STORAGE_KEY = 'liveTV_lastPlayed';

// Auto-hide controls variables
let controlsTimeout = null;
let isControlsVisible = true;

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const categoryGroup = document.getElementById('cats');
const channelCounter = document.getElementById('counter');
const playerOverlay = document.getElementById('player');
const closePlayerBtn = document.getElementById('close');
const backBtn = document.getElementById('back');
const videoEl = document.getElementById('video');
const playerContainer = document.getElementById('pc');
const playerName = document.getElementById('pname');
const playerLogo = document.getElementById('plogo');
const errorOverlay = document.getElementById('err');
const errorRetry = document.getElementById('retry');
const errorClose = document.getElementById('errclose');
const topBar = document.getElementById('topBar');
const pinfo = document.getElementById('pinfo');

// Auto-hide controls function
function toggleControls(show) {
  if (show) {
    topBar.classList.remove('hidden');
    pinfo.classList.remove('hidden');
    isControlsVisible = true;
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(() => {
      if (isControlsVisible && playerOverlay.classList.contains('active')) {
        topBar.classList.add('hidden');
        pinfo.classList.add('hidden');
        isControlsVisible = false;
      }
    }, 3000);
  } else {
    topBar.classList.add('hidden');
    pinfo.classList.add('hidden');
    isControlsVisible = false;
    clearTimeout(controlsTimeout);
  }
}

// Show controls on mouse move or touch
function showControlsTemporarily() {
  if (playerOverlay.classList.contains('active')) {
    toggleControls(true);
  }
}

// Listen for mouse movement and touch on player
playerOverlay.addEventListener('mousemove', showControlsTemporarily);
playerOverlay.addEventListener('touchstart', showControlsTemporarily);
playerOverlay.addEventListener('touchmove', showControlsTemporarily);

// Also show controls when video is interacted with
videoEl.addEventListener('play', showControlsTemporarily);
videoEl.addEventListener('pause', showControlsTemporarily);
videoEl.addEventListener('click', showControlsTemporarily);

function loadLastPlayed() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      lastPlayedChannels = JSON.parse(data).filter(ch => ch && ch.id && ch.name);
      return lastPlayedChannels;
    }
  } catch (_) {}
  return [];
}

function saveLastPlayed(channel) {
  if (!channel || !channel.id) return;
  lastPlayedChannels = lastPlayedChannels.filter(ch => ch.id !== channel.id);
  lastPlayedChannels.unshift(channel);
  lastPlayedChannels = lastPlayedChannels.slice(0, 10);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lastPlayedChannels)); } catch (_) {}
  renderLastPlayed();
}

function renderLastPlayed() {
  const section = document.getElementById('lastSection');
  const gridEl = document.getElementById('lastGrid');
  if (!lastPlayedChannels.length) { section.classList.remove('visible'); return; }
  section.classList.add('visible');
  gridEl.innerHTML = lastPlayedChannels.map((ch, index) => `
    <div class="last-card" data-channel='${JSON.stringify(ch).replace(/'/g,"&#39;")}' style="animation-delay: ${index * 0.06}s">
      <div class="lp-logo">
        <img src="${ch.logo || 'https://ui-avatars.com/api/?name='+encodeURIComponent(ch.name)+'&background=7C3AED&color=ffffff&size=50'}" 
             alt="${ch.name}" loading="lazy"
             onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(ch.name)}&background=7C3AED&color=ffffff&size=50';" />
      </div>
      <div class="lp-name">${ch.name}</div>
      <div class="lp-badge">▶ Play</div>
    </div>
  `).join('');

  gridEl.querySelectorAll('.last-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (isClosing || isPlaying) return;
      const raw = card.dataset.channel;
      try {
        const ch = JSON.parse(raw);
        setTimeout(() => playChannel(ch), 100);
      } catch (_) {}
    });
  });
}

function showError(channel) {
  if (isErrorShowing) return;
  isErrorShowing = true;
  errorChannel = channel;
  errorOverlay.classList.add('active');
}

function hideError() {
  isErrorShowing = false;
  errorOverlay.classList.remove('active');
  errorChannel = null;
}

errorRetry.addEventListener('click', () => {
  hideError();
  if (errorChannel) { cachedCookie = null; cookieTimestamp = 0; setTimeout(() => playChannel(errorChannel), 300); }
});

errorClose.addEventListener('click', () => { 
  hideError(); 
  if (playerOverlay.classList.contains('active')) closePlayer(); 
});

errorOverlay.addEventListener('click', (e) => { 
  if (e.target === errorOverlay) { 
    hideError(); 
    if (playerOverlay.classList.contains('active')) closePlayer(); 
  } 
});

async function fetchCookie() {
  const now = Date.now();
  if (cachedCookie && (now - cookieTimestamp) < COOKIE_MAX_AGE) return cachedCookie;
  try {
    const res = await fetch('https://fragrant-butterfly-575f.bhargavtodimela4.workers.dev/cookies', {
      cache: 'no-cache',
      headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
    });
    const data = await res.json();
    const cookieObj = data.find(item => item.cookie);
    if (cookieObj && cookieObj.cookie) { 
      cachedCookie = cookieObj.cookie; 
      cookieTimestamp = now; 
      return cachedCookie; 
    }
    return null;
  } catch (_) { return null; }
}

async function fetchChannels() {
  try {
    const res = await fetch('https://fragrant-butterfly-575f.bhargavtodimela4.workers.dev/channels', {
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
      cache: 'no-cache'
    });
    const data = await res.json();
    allChannels = Array.isArray(data) ? data : (data.channels || []);
    allChannels = allChannels.filter(c => c && typeof c === 'object' && c.name);
    extractCategories();
    applyFilters();
    updateCounter();
    loadLastPlayed();
    renderLastPlayed();
    return allChannels;
  } catch (_) {
    grid.innerHTML = `<div class="empty"><span class="material-symbols-outlined">wifi_off</span>Could not load channels. Please refresh.</div>`;
    return [];
  }
}

function extractCategories() {
  const cats = new Set(['All']);
  allChannels.forEach(c => { if (c.category && c.category.trim()) cats.add(c.category.trim()); });
  const sorted = ['All', ...Array.from(cats).filter(c => c !== 'All').sort()];
  categoryGroup.innerHTML = sorted.map(cat =>
    `<button class="cat ${cat === 'All' ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
  ).join('');
  document.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      applyFilters();
    });
  });
}

function applyFilters() {
  const term = searchTerm.toLowerCase().trim();
  filteredChannels = allChannels.filter(ch => {
    const matchName = ch.name.toLowerCase().includes(term);
    const matchCat = currentCategory === 'All' || ch.category === currentCategory;
    return matchName && matchCat;
  });
  renderGrid();
  updateCounter();
}

function renderGrid() {
  if (!filteredChannels.length) {
    grid.innerHTML = `<div class="empty"><span class="material-symbols-outlined">search_off</span>No channels found</div>`;
    return;
  }
  let html = '';
  filteredChannels.forEach((ch, idx) => {
    const logo = ch.logo || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(ch.name) + '&background=7C3AED&color=ffffff&size=80';
    html += `
      <div class="ch-card" data-channel='${JSON.stringify(ch).replace(/'/g,"&#39;")}' style="animation-delay: ${idx * 0.04}s">
        <div class="logo">
          <img src="${logo}" alt="${ch.name}" loading="lazy"
               onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(ch.name)}&background=7C3AED&color=ffffff&size=80';" />
        </div>
        <div class="name">${ch.name}</div>
        <span class="cat">${ch.category || 'General'}</span>
        <div class="play-overlay">
          <span class="material-symbols-outlined">play_arrow</span>
        </div>
      </div>
    `;
  });
  grid.innerHTML = html;
  document.querySelectorAll('.ch-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (isClosing || isPlaying) return;
      const raw = card.dataset.channel;
      try {
        const ch = JSON.parse(raw);
        if (playTimeout) clearTimeout(playTimeout);
        playTimeout = setTimeout(() => playChannel(ch), 100);
      } catch (_) {}
    });
  });
}

function updateCounter() {
  channelCounter.textContent = `${filteredChannels.length} / ${allChannels.length} channels`;
}

searchInput.addEventListener('input', (e) => { 
  searchTerm = e.target.value; 
  applyFilters(); 
});

async function playChannel(channel) {
  if (!channel || isClosing) return;
  if (isPlaying) { console.warn('Already playing'); return; }
  isPlaying = true;
  currentChannel = channel;
  playerName.textContent = channel.name || 'Channel';
  playerLogo.src = channel.logo || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(channel.name) + '&background=7C3AED&color=ffffff&size=40';
  saveLastPlayed(channel);
  destroyPlayer();
  playerOverlay.classList.add('active');
  
  // Show controls initially
  toggleControls(true);
  
  // Auto fullscreen
  try {
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else if (document.documentElement.webkitRequestFullscreen) {
      await document.documentElement.webkitRequestFullscreen();
    } else if (document.documentElement.msRequestFullscreen) {
      await document.documentElement.msRequestFullscreen();
    }
  } catch (_) {}

  try {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) { showError(channel); isPlaying = false; return; }
    shakaPlayer = new shaka.Player(videoEl);
    try { new shaka.ui.Overlay(shakaPlayer, playerContainer, videoEl); } catch (_) {}
    shakaPlayer.configure({
      preferredAudioLanguage: 'te',
      preferredTextLanguage: 'en',
      drm: {},
      streaming: { lowLatencyMode: true, rebufferingGoal: 2, bufferBehind: 30 }
    });
    const keyId = channel.keyId && channel.keyId !== 'null' ? channel.keyId : null;
    const key = channel.key && channel.key !== 'null' ? channel.key : null;
    if (keyId && key) {
      shakaPlayer.configure({ drm: { clearKeys: { [keyId]: key } }, streaming: { lowLatencyMode: true } });
    } else {
      shakaPlayer.configure({ drm: { clearKeys: {} }, streaming: { lowLatencyMode: true } });
    }
    const cookie = await fetchCookie();
    activeCookie = cookie || '';
    if (shakaPlayer.getNetworkingEngine) {
      const engine = shakaPlayer.getNetworkingEngine();
      engine.registerRequestFilter((type, request) => {
        request.headers["Referer"] = "https://www.jiotv.com/";
        request.headers["User-Agent"] = "plaYtv/7.1.5";
        if (activeCookie && (type === 0 || type === 1)) {
          request.uris[0] = request.uris[0].split("?")[0] + "?" + activeCookie;
        }
      });
    }
    const streamUrls = [channel.url, channel.url1, channel.url2, channel.url3]
      .filter(Boolean)
      .map(u => u.replace(/bpk-tv\/\//g, 'bpk-tv/'));
    let loaded = false;
    for (let i = 0; i < streamUrls.length; i++) {
      try {
        await shakaPlayer.load(streamUrls[i]);
        setTimeout(() => {
          try {
            const tracks = shakaPlayer.getAudioTracks();
            if (tracks && tracks.length) {
              let tel = tracks.find(t => t.language === 'te') || tracks.find(t => ['hi', 'ta', 'ml', 'kn', 'mr', 'bn'].includes(t.language));
              if (tel) shakaPlayer.selectAudioTrack(tel);
            }
          } catch (_) {}
        }, 500);
        await videoEl.play();
        loaded = true;
        console.log('✅ Playing:', channel.name);
        isPlaying = false;
        break;
      } catch (_) {}
    }
    if (!loaded) { showError(channel); isPlaying = false; }
  } catch (_) { showError(channel); isPlaying = false; }
}

function closePlayer() {
  if (isClosing) return;
  isClosing = true;
  hideError();
  isPlaying = false;
  if (playTimeout) { clearTimeout(playTimeout); playTimeout = null; }
  destroyPlayer();
  videoEl.pause();
  videoEl.src = '';
  playerOverlay.classList.remove('active');
  
  // Clear controls timeout
  clearTimeout(controlsTimeout);
  topBar.classList.remove('hidden');
  pinfo.classList.remove('hidden');
  isControlsVisible = true;
  
  // Exit fullscreen
  try {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.webkitFullscreenElement) {
      document.webkitExitFullscreen();
    } else if (document.msFullscreenElement) {
      document.msExitFullscreen();
    }
  } catch (_) {}
  
  setTimeout(() => {
    isClosing = false;
    currentChannel = null;
    activeCookie = null;
  }, 200);
}

function destroyPlayer() {
  if (shakaPlayer) { 
    try { 
      shakaPlayer.destroy(); 
    } catch (_) {} 
    shakaPlayer = null; 
  }
}

closePlayerBtn.addEventListener('click', closePlayer);
backBtn.addEventListener('click', closePlayer);
playerContainer.addEventListener('click', (e) => { 
  if (e.target === playerContainer) closePlayer(); 
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (errorOverlay.classList.contains('active')) { 
      hideError(); 
      if (playerOverlay.classList.contains('active')) closePlayer(); 
    } else { 
      closePlayer(); 
    }
  }
  if (e.key === ' ' && playerOverlay.classList.contains('active')) {
    e.preventDefault();
    videoEl.paused ? videoEl.play().catch(() => {}) : videoEl.pause();
    showControlsTemporarily();
  }
});

// ─── INIT ─────────────────────────────────────────────────
loadLastPlayed();
fetchChannels();
console.log('🚀 Live TV Premium loaded with auto-hide controls and enhanced brightness.');
</script>
</body>
</html>
