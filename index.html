const f=document.createDocumentFragment();
for(let r=VS.vs;r<VS.ve;r++){for(let c=0;c<VS.cols;c++){const i=r*VS.cols+c;if(i>=F.length)break;const ch=F[i],id='c'+(DI++),el=document.createElement('div');
el.className='cc';el.dataset.i=id;DM.set(el,ch);
const lo=ch.logo||FB72(ch.name);
el.innerHTML='<div class="lo"><img data-src="'+lo+'" alt="" width="72" height="72" decoding="async" onerror="this.onerror=null;this.src=\''+FB72(ch.name)+'\';this.dataset.loaded=\'1\'"/></div><div class="n">'+ch.name+'</div><span class="ca">'+(ch.category||'General')+'</span>';
f.appendChild(el);LI(el.querySelector('img'))}}
GI.replaceChildren(f)}

// === RECENTLY PLAYED ===
function LLP(){try{const d=localStorage.getItem(SK);if(d){LP=JSON.parse(d).filter(c=>c&&c.id&&c.name);return LP}}catch(_){}return[]}
function SLP(ch){if(!ch||!ch.id)return;LP=LP.filter(c=>c.id!==ch.id);LP.unshift(ch);LP.length=LP.length>10?10:LP.length;try{localStorage.setItem(SK,JSON.stringify(LP))}catch(_){}RLP()}
function RLP(){if(!LP.length){LZS.classList.remove('v');return}LZS.classList.add('v');const f=document.createDocumentFragment();for(let i=0;i<LP.length;i++){const ch=LP[i],id='r'+(DI++),el=document.createElement('div');el.className='lc';el.dataset.i=id;DM.set(el,ch);const lo=ch.logo||FB40(ch.name);el.innerHTML='<div class="lo"><img data-src="'+lo+'" alt="" width="40" height="40" decoding="async" onerror="this.onerror=null;this.src=\''+FB40(ch.name)+'\';this.dataset.loaded=\'1\'"/></div><div class="n">'+ch.name+'</div><div class="bd">▶</div>';f.appendChild(el);LI(el.querySelector('img'))}LG.replaceChildren(f)}

// === ERROR MODAL ===
function SE2(ch){if(IE)return;IE=true;EC=ch;EO.classList.add('a')}
function HE(){IE=false;EO.classList.remove('a');EC=null}
ER.addEventListener('click',()=>{HE();if(EC){CK=null;CT=0;setTimeout(()=>PC2(EC),200)}});
ECB.addEventListener('click',()=>{HE();if(PO.classList.contains('a'))CP()});
EO.addEventListener('click',e=>{if(e.target===EO){HE();if(PO.classList.contains('a'))CP()}});

// === COOKIE ===
async function FC2(){const n=Date.now();if(CK&&(n-CT)<CA)return CK;try{const r=await fetch(API+'/cookies',{cache:'no-cache',headers:{'Cache-Control':'no-cache'}});const d=await r.json(),o=d.find(i=>i.cookie);if(o&&o.cookie){CK=o.cookie;CT=n;return CK}return null}catch(_){return null}}

// === SHAKA HELPERS ===
function RN(en,coo){if(!en)return;en.registerRequestFilter((t,r)=>{r.headers["Referer"]="https://www.jiotv.com/";r.headers["User-Agent"]="plaYtv/7.1.5";if(coo&&(t===0||t===1))r.uris[0]=r.uris[0].split("?")[0]+"?"+coo})}
async function TU(p,u){for(let i=0;i<u.length;i++){try{await p.load(u[i]);return true}catch(_){}}return false}
function GUL(c){return[c.url,c.url1,c.url2,c.url3].filter(Boolean).map(u=>u.replace(/bpk-tv\/\//g,'bpk-tv/'))}

// === WEB WORKER ===
let WW=null,WR=false;
function IW(){try{WW=new Worker('./worker.js');WR=true;WW.onmessage=function(e){const d=e.data;switch(d.type){case'FILTERED':renderGrid(d.data);break;case'CATEGORIES':buildCats(d.data);break;case'FILTERED_SUGGESTIONS':renderSG(d.data);break}};WW.onerror=()=>{WR=false}}catch(_){WR=false}}
function WP(t,p){if(WW&&WR)WW.postMessage({type:t,payload:p})}

// === CHANNEL FETCH ===
async function FC(){try{const r=await fetch(API+'/channels',{headers:{'X-Requested-With':'XMLHttpRequest'},cache:'no-cache'});const d=await r.json();A.length=0;const arr=Array.isArray(d)?d:(d.channels||[]);for(let i=0;i<arr.length;i++){const c=arr[i];if(c&&typeof c==='object'&&c.name)A.push(c)}if(WR)WW.postMessage({type:'SET_CHANNELS',payload:A});EC2();BD(()=>{F.length=0;for(let i=0;i<A.length;i++)F.push(A[i]);RVG()});LLP();RLP();return A}catch(_){GI.innerHTML=`<div class="em">${E_SVG}Failed to load channels</div>`;return[]}}

// === CATEGORIES ===
function EC2(){const s=new Set(['All']);for(let i=0;i<A.length;i++){const c=A[i].category;if(c&&c.trim())s.add(c.trim())}const arr=Array.from(s).sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));buildCats(arr)}
function buildCats(cats){const f=document.createDocumentFragment();for(let i=0;i<cats.length;i++){const b=document.createElement('button');b.className='c'+(i===0?' a':'');b.dataset.c=encodeURIComponent(cats[i]);b.textContent=cats[i];f.appendChild(b)}CG.replaceChildren(f)}

// === SEARCH + FILTER ===
function renderGrid(data){BD(()=>{F.length=0;for(let i=0;i<data.length;i++)F.push(data[i]);RVG()})}
const doSearch=DB(function(){if(WR){WP('FILTER',{search:ST,category:CC})}else{BD(()=>{F.length=0;const t=ST.toLowerCase();for(let i=0;i<A.length;i++){const ch=A[i];if(ch.name.toLowerCase().includes(t)&&(CC==='All'||ch.category===CC))F.push(ch)}RVG()})}},100);
SI.addEventListener('input',e=>{ST=e.target.value;doSearch()});

// === SEARCH SUGGESTIONS ===
function renderSG(sg){if(!sg||!sg.length){SG.classList.remove('v');return}SG.classList.add('v');const f=document.createDocumentFragment();for(let i=0;i<sg.length;i++){const s=sg[i],el=document.createElement('div');el.className='si';el.dataset.name=s.name;el.innerHTML='<span>'+s.name+'</span><span class="sc">'+(s.category||'')+'</span>';f.appendChild(el)}SG.replaceChildren(f)}
const doSG=DB(function(q){if(WR&&q&&q.length>=2){WP('FILTER',{search:q,category:'All'})}else{SG.classList.remove('v')}},200);
SI.addEventListener('input',e=>{doSG(e.target.value)});
SG.addEventListener('click',e=>{const s=e.target.closest('.si');if(s){SI.value=s.dataset.name;ST=s.dataset.name;SG.classList.remove('v');doSearch()}});
document.addEventListener('click',e=>{if(!SG.contains(e.target)&&e.target!==SI)SG.classList.remove('v')});

// === PI PREVIEW ===
async function SP2(ch){if(!ch||PA)return;if(PVT)clearTimeout(PVT);PVT=setTimeout(async()=>{try{SP3();PA=true;PVB.style.display='block';PVV.muted=true;PVV.controls=false;shaka.polyfill.installAll();if(!shaka.Player.isBrowserSupported()){SP3();return}PS=new shaka.Player(PVV);const k=ch.keyId&&ch.keyId!=='null'?ch.keyId:null,ky=ch.key&&ch.key!=='null'?ch.key:null;PS.configure({preferredAudioLanguage:'te',drm:k&&ky?{clearKeys:{[k]:ky}}:{},streaming:{lowLatencyMode:true,rebufferingGoal:2,bufferBehind:30}});const coo=await FC2();AC=coo||'';RN(PS.getNetworkingEngine(),AC);if(await TU(PS,GUL(ch))){await PVV.play()}else SP3()}catch(_){SP3()}},300)}
function SP3(){if(PVT){clearTimeout(PVT);PVT=null}PA=false;if(PS){try{PS.destroy()}catch(_){}PS=null}PVV.pause();PVV.removeAttribute('src');PVV.load();PVB.style.display='none'}

// === FULLSCREEN ===
function FS(){try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(_){}}
function XFS(){try{if(document.fullscreenElement)document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen()}catch(_){}}

// === MAIN PLAYER ===
async function PC2(ch){if(!ch||CL||IP)return;IP=true;PN.textContent=ch.name||'Channel';PL.src=ch.logo||FB32(ch.name);SLP(ch);DP();SP3();PO.classList.add('a');FS();try{shaka.polyfill.installAll();if(!shaka.Player.isBrowserSupported()){SE2(ch);IP=false;return}SP=new shaka.Player(VE);try{new shaka.ui.Overlay(SP,PC,VE,{controlPanelElements:['time_and_duration','mute','volume','fullscreen','overflow_menu'],overflowMenuButtons:['captions','quality','language','playback_rate']});VE.controls=false}catch(_){VE.controls=true}const k=ch.keyId&&ch.keyId!=='null'?ch.keyId:null,ky=ch.key&&ch.key!=='null'?ch.key:null;SP.configure({preferredAudioLanguage:'te',preferredTextLanguage:'en',drm:k&&ky?{clearKeys:{[k]:ky}}:{clearKeys:{}},streaming:{lowLatencyMode:true,rebufferingGoal:2,bufferBehind:30}});const coo=await FC2();AC=coo||'';RN(SP.getNetworkingEngine(),AC);if(await TU(SP,GUL(ch))){setTimeout(()=>{try{const tr=SP.getAudioTracks();if(tr&&tr.length){const tel=tr.find(t=>t.language==='te')||tr.find(t=>['hi','ta','ml','kn','mr','bn'].includes(t.language));if(tel)SP.selectAudioTrack(tel)}}catch(_){}},300);await VE.play();IP=false}else{SE2(ch);IP=false}}catch(_){SE2(ch);IP=false}}
function CP(){if(CL)return;CL=true;HE();IP=false;if(PT){clearTimeout(PT);PT=null}DP();VE.pause();VE.removeAttribute('src');VE.load();VE.controls=true;PO.classList.remove('a');SP3();XFS();setTimeout(()=>{CL=false;EC=null;AC=null},150)}
function DP(){if(SP){try{SP.destroy()}catch(_){}SP=null}}

// === EVENT LISTENERS (single delegation point) ===
CB.addEventListener('click',CP);BB.addEventListener('click',CP);
PC.addEventListener('click',e=>{if(e.target===PC)CP()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(EO.classList.contains('a')){HE();if(PO.classList.contains('a'))CP()}else CP()}if(e.key===' '&&PO.classList.contains('a')){e.preventDefault();VE.paused?VE.play().catch(()=>{}):VE.pause()}});
CG.addEventListener('click',e=>{const b=e.target.closest('.c');if(!b)return;CG.querySelectorAll('.c').forEach(x=>x.classList.remove('a'));b.classList.add('a');CC=decodeURIComponent(b.dataset.c);doSearch()});

// Grid + Recent delegation (single handler for both)
function handleCardClick(e){if(CL||IP)return;const c=e.target.closest('.cc,.lc');if(c){const ch=DM.get(c);if(ch){if(PT)clearTimeout(PT);PT=setTimeout(()=>PC2(ch),50)}}}
function handleCardEnter(e){if(IP||PO.classList.contains('a'))return;const c=e.target.closest('.cc,.lc');if(c){const ch=DM.get(c);if(ch)SP2(ch)}}
GI.addEventListener('click',handleCardClick);
GI.addEventListener('mouseenter',handleCardEnter,true);
GI.addEventListener('mouseleave',()=>SP3(),true);
LG.addEventListener('click',handleCardClick);
LG.addEventListener('mouseenter',handleCardEnter,true);
LG.addEventListener('mouseleave',()=>SP3(),true);

// === VIRTUAL SCROLL + RESIZE ===
const vsH=DB(()=>{VS.sh=GR.scrollTop;RVG()},16);
const rsH=DB(()=>{CGD();RVG()},200);
GR.addEventListener('scroll',vsH,{passive:true});
window.addEventListener('resize',rsH,{passive:true});

// === CORE WEB VITALS MONITOR ===
const PM={lcp:0,cls:0,inp:0,fcp:0,ttfb:0};
function IPM(){try{new PerformanceObserver(l=>{const e=l.getEntries(),last=e[e.length-1];if(last)PM.lcp=Math.round(last.startTime)}).observe({type:'largest-contentful-paint',buffered:true})}catch(_){}try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)PM.cls+=e.value}).observe({type:'layout-shift',buffered:true})}catch(_){}try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(e.name==='first-contentful-paint')PM.fcp=Math.round(e.startTime)}).observe({type:'paint',buffered:true})}catch(_){}const nv=performance.getEntriesByType('navigation')[0];if(nv)PM.ttfb=Math.round(nv.responseStart);let ie=[];try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(e.interactionId){ie.push(e);if(ie.length>10)ie=ie.slice(-10)}}).observe({type:'event',buffered:true,deliveryThreshold:0})}catch(_){}setInterval(()=>{let wi=0;if(ie.length){const d=ie.map(e=>e.duration).sort((a,b)=>b-a);wi=Math.round(d[0]||0)}PM.inp=wi;const g=PM.lcp<2500&&PM.cls<0.1&&PM.inp<200?'🟢':PM.lcp<4000&&PM.cls<0.25&&PM.inp<500?'🟡':'🔴';PF.textContent=g+' LCP:'+PM.lcp+'ms CLS:'+PM.cls.toFixed(3)+' INP:'+PM.inp+'ms';PF.classList.add('v')},3000)}

// === INIT ===
IW();LLP();FC();IPM();
if('serviceWorker' in navigator)(self.requestIdleCallback||setTimeout)(()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='CHANNELS_UPDATED')FC()})}).catch(()=>{})},200);
</script>
