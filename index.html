<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="Fast Live TV channel browser with instant search, categories and HLS/DASH playback.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<title>Live TV</title>
<style>html{background:#0b0e14}body{margin:0;visibility:hidden}body.ready{visibility:visible}</style>
</head>
<body>
<header class="h">
  <div class="hb">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 14H3V8h18v12zM9 10v8l7-4z"/></svg></span>
    <h1>Live TV</h1>
  </div>
  <span class="cnt" id="counter">Loading…</span>
  <button class="theme" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
    <svg class="moon" viewBox="0 0 24 24"><path d="M10 2c-1.82 0-3.53.5-5 1.35C7.99 5.08 10 8.3 10 12s-2.01 6.92-5 8.65C6.47 21.5 8.18 22 10 22c5.52 0 10-4.48 10-10S15.52 2 10 2z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
  </button>
</header>

<div class="offline-bar" id="offlineBar" role="status" hidden>
  <svg viewBox="0 0 24 24"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.19.46L17 12.7 23.64 7zm-6.44 6.66L3.38 1.79 1.97 3.2l1.61 1.61C2.02 5.63.71 6.79.36 7l10.4 13.35h.2L6.6 13.9c1.67-.78 4.12-1.6 7.15-1.6 2.44 0 4.5.77 6.09 1.65l-2.64-2.29z"/></svg>
  <span>You are offline — showing cached data</span>
</div>

<div class="fb">
  <div class="sr">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="search" placeholder="Search channels..." autocomplete="off" enterkeyhint="search">
  </div>
  <div class="cats" id="cats"></div>
</div>

<div class="ls" id="lastSection">
  <div class="title">Recently played</div>
  <div class="lg" id="lastGrid"></div>
</div>

<div class="g" id="grid"></div>

<div class="toast" id="toast" role="status"></div>

<div class="pl" id="player">
  <div class="tb">
    <button class="pb" id="back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back
    </button>
    <button class="px" id="close">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="pc">
    <video id="video" playsinline autoplay></video>
    <div class="pload" id="pload"><div class="spinner"></div></div>
  </div>
  <div class="pi" id="pinfo"><img id="plogo" alt="logo"><span class="pname" id="pname"></span></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
