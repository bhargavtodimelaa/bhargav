<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <!-- Meta refresh redirect -->
  <meta http-equiv="refresh" content="0; url=https://livetv-rouge.vercel.app/">
  
  <!-- JavaScript redirect (backup) -->
  <script>
    window.location.replace('https://livetv-rouge.vercel.app/');
  </script>
</head>
<body>
  <div style="
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0F0A1A;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    flex-direction: column;
    gap: 20px;
    text-align: center;
    padding: 20px;
  ">
    <div style="
      width: 50px;
      height: 50px;
      border: 3px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7C3AED;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    "></div>
    <div>
      <h2 style="font-size: 1.3rem; margin-bottom: 6px; background: linear-gradient(135deg, #7C3AED, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Redirecting...</h2>
      <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">
        If not redirected, <a href="https://livetv-rouge.vercel.app/" style="color: #7C3AED; text-decoration: none; font-weight: 600;">click here</a>
      </p>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
