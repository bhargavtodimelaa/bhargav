<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
  <meta content="#020105" name="theme-color">
  <title>Live Tv - By Bhargav</title>
  <link href="https://cdnjs.cloudflare.com" rel="preconnect" crossorigin>
  <link href="https://fragrant-butterfly-575f.bhargavtodimela4.workers.dev" rel="preconnect" crossorigin>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #020105;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-active: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-primary: #fff;
      --text-secondary: #9ca3af;
      --radius-lg: 24px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      overscroll-behavior: none;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(circle at top left, rgba(139, 92, 246, 0.12), transparent 40%);
      color: var(--text-primary);
      font-family: var(--font-ui);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeSpeed;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(2, 1, 5, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      contain: layout style;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-sq {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .logo-sq svg {
      fill: #fff;
      width: 22px;
      height: 22px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
    }

    .toolbar {
      padding: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      contain: layout;
    }

    .search-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.75rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.3s;
      contain: layout style;
    }

    .search-container:focus-within {
      border-color: var(--accent);
    }

    .search-container input {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      width: 100%;
      font-size: 1rem;
      font-family: inherit;
    }

    .category-row {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      contain: layout style;
    }

    .category-row::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      white-space: nowrap;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
      contain: layout style;
      font-family: inherit;
    }

    .cat-chip.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .grid-wrap {
      position: relative;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 24px;
      position: relative;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 16px;
      }
      .grid-wrap {
        padding: 0 1rem 3rem;
      }
      #pip-preview {
        display: none !important;
      }
    }

    .spacer {
      grid-column: 1 / -1;
      width: 100%;
      pointer-events: none;
    }

    .channel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.8rem 1rem 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.2, 0.1, 0.3, 1), border-color 0.4s, background 0.4s;
      contain: layout style;
    }

    .channel-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      background: var(--surface-active);
      z-index: 2;
      will-change: transform;
    }

    .logo-wrap {
      width: 75px;
      height: 75px;
      margin: 0 auto 1.2rem;
      background: #fff;
      border-radius: 18px;
      padding: 12px;
      transition: transform 0.3s;
      contain: layout style;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      background: #fff;
    }

    .channel-card .name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      height: 2.4em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.25;
    }

    .channel-card .tag {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .history-sec {
      padding: 0 1.5rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
      display: none;
      contain: layout style;
    }

    .history-sec.visible {
      display: block;
    }

    .history-scroll {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 10px;
      -webkit-overflow-scrolling: touch;
      contain: layout style;
    }

    .history-scroll .channel-card {
      flex: 0 0 130px;
      padding: 1rem;
    }

    .history-scroll .channel-card .logo-wrap {
      width: 45px;
      height: 45px;
      padding: 6px;
    }

    .history-scroll .channel-card .name {
      font-size: 0.7rem;
    }

    .player-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      flex-direction: column;
      contain: strict;
    }

    .player-overlay.active {
      display: flex;
    }

    #player-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }

    #video-element {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
    }

    .player-ui {
      transition: opacity 0.4s ease;
      z-index: 100;
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .player-ui.hide {
      opacity: 0;
      pointer-events: none;
    }

    .p-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
      z-index: 10;
      gap: 1rem;
    }

    .p-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .p-header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
    }

    .error-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      contain: strict;
    }

    .error-overlay.active {
      display: flex;
    }

    .error-card {
      background: #111;
      padding: 3rem;
      border-radius: 32px;
      text-align: center;
      border: 1px solid #333;
      max-width: 400px;
      width: 90%;
      contain: layout style;
    }

    .error-card h2 {
      margin-bottom: 0.5rem;
      font-family: var(--font-display);
    }

    .error-card p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .exit-btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 0.75rem 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
      font-family: inherit;
      font-size: inherit;
    }

    .exit-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #pip-preview {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 280px;
      height: 157px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: none;
      border: 2px solid var(--accent);
      z-index: 1500;
      pointer-events: none;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      contain: strict;
    }

    #pip-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .back-hub-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      pointer-events: auto;
      font-family: inherit;
    }

    .back-hub-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: var(--accent);
    }

    .back-hub-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .audio-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 0.6rem 1.1rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      pointer-events: auto;
      font-family: inherit;
      position: relative;
    }

    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: var(--accent);
    }

    .audio-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .audio-btn .audio-label {
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .audio-menu {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: rgba(15, 10, 25, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      min-width: 180px;
      max-width: 280px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 0.5rem;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      z-index: 20;
    }

    .audio-menu.active {
      display: block;
    }

    .audio-menu-item {
      padding: 0.65rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .audio-menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .audio-menu-item.selected {
      background: rgba(139, 92, 246, 0.25);
      color: #fff;
    }

    .audio-menu-item.selected::after {
      content: "✓";
      color: var(--accent);
      font-weight: 800;
    }

    .audio-menu::-webkit-scrollbar {
      width: 6px;
    }

    .audio-menu::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .shaka-bottom-controls,
    .shaka-controls-button-panel,
    .shaka-controls-container,
    .shaka-ui-overlay,
    .shaka-video-container {
      z-index: 5 !important;
    }

    .shaka-controls-container {
      pointer-events: auto !important;
    }

    .shaka-scrim-container {
      z-index: 4 !important;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="logo-sq">
        <svg viewBox="0 0 24 24">

  <div class="toolbar">

  <div class="grid-wrap" id="gw">

  <div class="player-overlay" id="p">

            </button>
          </div>
          <div class="p-header-right">
            <button class="audio-btn" id="audioBtn" aria-label="Audio Track" style="display:none">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
              <span class="audio-label" id="audioLabel">Audio</span>
            </button>
            <div class="audio-menu" id="audioMenu"></div>
          </div>
        </div>
      </div>
      <video id="video-element" playsinline autoplay></video>
    </div>
  </div>

  <div class="error-overlay" id="e">
    <div class="error-card">
      <h2>Stream Unavailable</h2>

  </div>

  <script>
    /* ──────────────────────────────────────────────────────────────────────
       1. SERVICE WORKER & CACHE CLEANUP
       ────────────────────────────────────────────────────────────────────── */
    (function cleanupServiceWorkers() {
      if (!("serviceWorker" in navigator)) return;
      try {
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          })
          .catch(function () {});

        if (window.caches && caches.keys) {
          caches.keys()
            .then(function (keys) {
              for (var i = 0; i < keys.length; i++) {
                if (keys[i].indexOf("ripple") === 0) {
                  try { caches.delete(keys[i]); } catch (e) {}
                }
              }
            })
            .catch(function () {});
        }
      } catch (e) {}
    })();

    /* ──────────────────────────────────────────────────────────────────────
       2. SHAKA LOADER (lazy, ref-counted)
       ────────────────────────────────────────────────────────────────────── */
    window.__RIPPLE_SHAKA__ = (function () {
      "use strict";

      var shakaPromise = null;
      var unloadTimer = null;
      var acquireCount = 0;
      var UNLOAD_DELAY = 90000; // 90s after last release

      function scheduleUnload() {
        if (unloadTimer) clearTimeout(unloadTimer);
        unloadTimer = setTimeout(function () {
          if (acquireCount === 0 && shakaPromise) {
            shakaPromise = null;
            var script = document.querySelector("script[data-shaka]");
            if (script && script.parentNode) script.parentNode.removeChild(script);
            window.shaka = undefined;
          }
        }, UNLOAD_DELAY);
      }

      function loadShaka() {
        if (shakaPromise) return shakaPromise;

        shakaPromise = new Promise(function (resolve, reject) {
          if (window.shaka && window.shaka.Player) {
            return resolve(window.shaka);
          }

          var script = document.createElement("script");
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js";
          script.async = true;
          script.setAttribute("data-shaka", "1");
          script.onload = function () { resolve(window.shaka); };
          script.onerror = function () {
            shakaPromise = null;
            reject(new Error("Shaka load failed"));
          };
          document.head.appendChild(script);
        });

        return shakaPromise;
      }

      return {
        load: loadShaka,
        acquire: function () {
          acquireCount++;
          if (unloadTimer) { clearTimeout(unloadTimer); unloadTimer = null; }
          return loadShaka();
        },
        release: function () {
          acquireCount = Math.max(0, acquireCount - 1);
          scheduleUnload();
        },
        scheduleUnload: scheduleUnload
      };
    })();

    /* ──────────────────────────────────────────────────────────────────────
       3. MAIN APPLICATION
       ────────────────────────────────────────────────────────────────────── */
    (function () {
      "use strict";

      /* ── Constants ─────────────────────────────────────────────────────── */
      var API_BASE = "https://fragrant-butterfly-575f.bhargavtodimela4.workers.dev";

        bn: "Bengali", ben: "Bengali",
        mr: "Marathi", mar: "Marathi",

        pa: "Punjabi", pan: "Punjabi",

        ur: "Urdu", urd: "Urdu",

      /* ── State ─────────────────────────────────────────────────────────── */
      var channels = [];

      var vs = {

      /* ── DOM cache ─────────────────────────────────────────────────────── */

      function cacheDom() {
        $ = {
          p: document.getElementById("p"),
          pu: document.getElementById("pu"),
          g: document.getElementById("g"),
          h: document.getElementById("h"),
          hg: document.getElementById("hg"),
          c: document.getElementById("c"),
          gw: document.getElementById("gw"),
          s: document.getElementById("s"),
          count: document.getElementById("count"),
          e: document.getElementById("e"),
          r: document.getElementById("r"),
          audioBtn: document.getElementById("audioBtn"),
          audioMenu: document.getElementById("audioMenu"),
          audioLabel: document.getElementById("audioLabel"),
          video: document.getElementById("video-element"),
          container: document.getElementById("player-container"),
          backBtn: document.getElementById("backHubBtn"),
          pipPreview: document.getElementById("pip-preview"),
          pipVideo: document.getElementById("pip-video")
        };
      }

      /* ── Utilities ─────────────────────────────────────────────────────── */
      function escapeHtml(str) {
        if (str == null) return "";
        return String(str).replace(/[&<>"']/g, function (c) {
          return c === "&" ? "&amp;"
            : c === "<" ? "&lt;"
            : c === ">" ? "&gt;"
            : c === '"' ? "&quot;"
            : "&#39;";
        });
      }

      function makePlaceholder(name) {
        var letter = (name || "?").trim().charAt(0).toUpperCase() || "?";
        return "data:image/svg+xml;utf8," + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
          '<rect width="100" height="100" rx="18" fill="#8B5CF6"/>' +
          '<text x="50" y="66" text-anchor="middle" fill="#fff" ' +
          'font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" ' +
          'font-weight="700" font-size="44">' + letter + '</text></svg>'
        );
      }

      function langLabel(code) {
        if (!code) return "Unknown";
        var lc = String(code).toLowerCase();
        return LANG_MAP[lc] || String(code).toUpperCase();
      }

      /* ── Cookies ───────────────────────────────────────────────────────── */
      function fetchCookies() {
        var now = Date.now();
        if (cookiesCache && now - cookiesTimestamp < COOKIE_TTL) {
          return Promise.resolve(cookiesCache);
        }
        return fetch(API_BASE + "/cookies")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            for (var i = 0; i < data.length; i++) {
              if (data[i].cookie) {
                cookiesCache = data[i].cookie;
                cookiesTimestamp = now;
                return cookiesCache;
              }
            }
            return null;
          })
          .catch(function () { return null; });
      }

      /* ── Channel loading ───────────────────────────────────────────────── */
      function loadChannels() {
        var fromCache = false;

        try {
          var cached = localStorage.getItem(LS_CHANNELS);
          if (cached) {
            var parsed = JSON.parse(cached);
            var list = parsed && (Array.isArray(parsed) ? parsed : parsed.channels);
            if (list && list.length) {
              channels = Object.freeze(list);
              fromCache = true;
              renderCategories();
              applyFilters();
            }
          }
        } catch (e) {}

        fetch(API_BASE + "/channels")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var list = Array.isArray(data) ? data : (data.channels || []);
            if (list.length && (!fromCache || channelsDiffer(channels, list))) {
              channels = Object.freeze(list);
              try {
                localStorage.setItem(LS_CHANNELS, JSON.stringify({ channels: list, ts: Date.now() }));
              } catch (e) {}
              renderCategories();
              applyFilters();
            }
          })
          .catch(function () { console.error("Channel fetch error"); });
      }

      function channelsDiffer(a, b) {
        if (!a || !b) return true;
        if (a.length !== b.length) return true;
        for (var i = 0; i < a.length; i++) {
          var x = a[i], y = b[i];
          if (!y) return true;
          if ((x.id || x.name) !== (y.id || y.name)) return true;
          if (x.name !== y.name) return true;
          if (x.logo !== y.logo) return true;
          if (x.category !== y.category) return true;
          if (x.url !== y.url) return true;
        }
        return false;
      }

      /* ── Categories ────────────────────────────────────────────────────── */
      function renderCategories() {
        var seen = { All: 1 };
        for (var i = 0; i < channels.length; i++) {
          if (channels[i].category) seen[channels[i].category] = 1;
        }
        var cats = Object.keys(seen).sort();
        var html = [];
        for (var j = 0; j < cats.length; j++) {
          var cat = cats[j];
          html.push(
            '<button class="cat-chip' + (cat === activeCategory ? " active" : "") +
            '" data-cat="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</button>'
          );
        }
        $.c.innerHTML = html.join("");
      }

      /* ── Virtual scrolling ─────────────────────────────────────────────── */
      function measureGrid() {
        if (!$.g) return;
        var style = window.getComputedStyle($.g);
        var gap = parseFloat(style.columnGap) || 24;
        var cols = (style.gridTemplateColumns || "")
          .split(" ")
          .filter(function (s) { return s.length > 0; }).length;
        if (!cols || cols < 1) cols = 1;

        var cardH = window.innerWidth < 768 ? 190 : 220;
        var rowsPerScreen = Math.max(1,
          Math.ceil((window.innerHeight || 800) / (cardH + gap))) + 1;

        vs.cols = cols;
        vs.gap = gap;
        vs.cardH = cardH;
        vs.rowsPerScreen = rowsPerScreen;
      }

      function renderVirtual(force) {
        if (!$.g) return;
        var total = filtered.length;

        if (total === 0) {
          $.g.innerHTML = "";
          vs.startRow = -1;
          vs.endRow = -1;
          return;
        }

        var cols = vs.cols || 1;
        var rowsPerScreen = vs.rowsPerScreen || 6;
        var overscan = vs.overscan;
        var totalRows = Math.ceil(total / cols);
        var startRow, endRow;

        if (force) {
          startRow = 0;
          endRow = Math.min(totalRows, overscan + rowsPerScreen);
        } else {
          var scrollY = window.scrollY || window.pageYOffset || 0;
          var rowH = (vs.cardH || 220) + (vs.gap || 24);
          var viewBottom = scrollY + (window.innerHeight || 800);
          startRow = Math.max(0, Math.floor(scrollY / rowH) - overscan);
          endRow = Math.min(totalRows, Math.ceil(viewBottom / rowH) + overscan);
        }

        if (!force && startRow === vs.startRow && endRow === vs.endRow) return;
        vs.startRow = startRow;
        vs.endRow = endRow;

        var startIdx = startRow * cols;
        var endIdx = Math.min(total, endRow * cols);

        var topSpacer = document.createElement("div");
        topSpacer.className = "spacer";
        topSpacer.style.gridColumn = "1 / -1";
        topSpacer.style.height = startRow * (vs.cardH + vs.gap) + "px";

        var bottomSpacer = document.createElement("div");
        bottomSpacer.className = "spacer";
        bottomSpacer.style.gridColumn = "1 / -1";
        bottomSpacer.style.height = Math.max(0, (totalRows - endRow) * (vs.cardH + vs.gap)) + "px";

        var frag = document.createDocumentFragment();
        frag.appendChild(topSpacer);
        for (var i = startIdx; i < endIdx; i++) {
          frag.appendChild(buildCard(filtered[i], i));
        }
        frag.appendChild(bottomSpacer);

        $.g.innerHTML = "";
        $.g.appendChild(frag);
      }

      function buildCard(channel, index) {
        var card = document.createElement("div");
        card.className = "channel-card";
        card.setAttribute("data-id", channel.id || channel.name);

        var placeholder = makePlaceholder(channel.name);
        var logoSrc = channel.logo || placeholder;

        var logoWrap = document.createElement("div");
        logoWrap.className = "logo-wrap";

        var img = document.createElement("img");
        img.loading = "lazy";
        img.decoding = "async";
        img.width = 75;
        img.height = 75;
        img.onerror = function () { this.onerror = null; this.src = placeholder; };
        img.src = logoSrc;
        if (index < 8) img.setAttribute("fetchpriority", "high");

        logoWrap.appendChild(img);
        card.appendChild(logoWrap);

        var nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = channel.name;
        card.appendChild(nameEl);

        var tagEl = document.createElement("div");
        tagEl.className = "tag";
        tagEl.textContent = channel.category || "Live";
        card.appendChild(tagEl);

        return card;
      }

      function onScroll() {
        if (scrollRaf) return;
        scrollRaf = requestAnimationFrame(function () {
          scrollRaf = null;
          renderVirtual(false);
        });
      }

      /* ── Filtering ─────────────────────────────────────────────────────── */
      function applyFilters() {
        var q = searchQuery.toLowerCase();
        var out = [];
        for (var i = 0; i < channels.length; i++) {
          var ch = channels[i];
          if (activeCategory !== "All" && ch.category !== activeCategory) continue;
          if (q && ch.name.toLowerCase().indexOf(q) === -1) continue;
          out.push(ch);
        }
        filtered = out;
        $.count.innerText = filtered.length;

        if (!vs.enabled) {
          vs.enabled = true;
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", function () {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
              measureGrid();
              vs.startRow = -1;
              vs.endRow = -1;
              renderVirtual(true);
            }, RESIZE_DEBOUNCE);
          }, { passive: true });
        }

        requestAnimationFrame(function () {
          measureGrid();
          vs.startRow = -1;
          vs.endRow = -1;
          renderVirtual(true);
        });
      }

      /* ── History ───────────────────────────────────────────────────────── */
      function renderHistory() {
        var history;
        try { history = JSON.parse(localStorage.getItem(LS_HISTORY) || "[]"); }
        catch (e) { history = []; }

        if (!history.length) {
          $.h.classList.remove("visible");
          $.hg.innerHTML = "";
          return;
        }

        var html = [];
        for (var i = 0; i < history.length; i++) {
          var item = history[i];
          var placeholder = makePlaceholder(item.name);
          var logoSrc = item.logo || placeholder;
          html.push(
            '<div class="channel-card" data-id="' + escapeHtml(item.id || item.name) + '">' +
            '<div class="logo-wrap">' +
            '<img src="' + escapeHtml(logoSrc) + '" loading="lazy" decoding="sync" ' +
            'width="45" height="45" onerror="this.onerror=null;this.src=\'' +
            escapeHtml(placeholder) + '\'"></div>' +
            '<div class="name">' + escapeHtml(item.name) + '</div></div>'
          );
        }
        $.hg.innerHTML = html.join("");
        $.h.classList.add("visible");
      }

      function addToHistory(channel) {
        try {
          var history = JSON.parse(localStorage.getItem(LS_HISTORY) || "[]");
          var id = channel.id || channel.name;
          var entry = {
            id: channel.id,
            name: channel.name,
            logo: channel.logo,
            category: channel.category,
            url: channel.url,
            url1: channel.url1,
            url2: channel.url2,
            url3: channel.url3,
            key: channel.key,
            keyId: channel.keyId
          };
          var next = [entry];
          for (var i = 0; i < history.length && next.length < HISTORY_MAX; i++) {
            if ((history[i].id || history[i].name) !== id) next.push(history[i]);
          }
          localStorage.setItem(LS_HISTORY, JSON.stringify(next));
          renderHistory();
        } catch (e) {}
      }

      function findChannel(id) {
        for (var i = 0; i < channels.length; i++) {
          if ((channels[i].id || channels[i].name) === id) return channels[i];
        }
        try {
          var hist = JSON.parse(localStorage.getItem(LS_HISTORY) || "[]");
          for (var j = 0; j < hist.length; j++) {
            if ((hist[j].id || hist[j].name) === id) return hist[j];
          }
        } catch (e) {}
        return null;
      }

      /* ── Player UI visibility ──────────────────────────────────────────── */
      function showUI() {
        if (!$.p || !$.p.classList.contains("active")) return;
        $.pu.classList.remove("hide");
        var controls = document.querySelectorAll(".shaka-controls-container");
        for (var i = 0; i < controls.length; i++) controls[i].style.opacity = "1";
        resetUiTimer();
      }

      function hideUI() {
        if (!$.p || !$.p.classList.contains("active")) return;
        $.pu.classList.add("hide");
        var controls = document.querySelectorAll(".shaka-controls-container");
        for (var i = 0; i < controls.length; i++) controls[i].style.opacity = "0";
        if ($.audioMenu) $.audioMenu.classList.remove("active");
      }

      function resetUiTimer() {
        if (uiTimer) clearTimeout(uiTimer);
        uiTimer = setTimeout(hideUI, UI_HIDE_MS);
      }

      function clearUiTimer() {
        if (uiTimer) { clearTimeout(uiTimer); uiTimer = null; }
      }

      /* ── Audio menu ────────────────────────────────────────────────────── */
      function updateAudioMenu() {
        if (!mainPlayer) return;

        var tracks = [];
        try {
          tracks = mainPlayer.getVariantTracks ? mainPlayer.getVariantTracks() : [];
        } catch (e) { tracks = []; }

        var seen = {};
        var langs = [];
        var activeLang = "";

        for (var i = 0; i < tracks.length; i++) {
          var t = tracks[i];
          var lang = t.language || "";
          if (!lang) continue;
          if (t.active) activeLang = lang;
          if (!seen[lang]) {
            seen[lang] = true;
            langs.push({ language: lang, track: t });
          }
        }

        if (langs.length <= 1) {
          if ($.audioBtn) $.audioBtn.style.display = "none";
          if ($.audioMenu) $.audioMenu.classList.remove("active");
          return;
        }

        if ($.audioBtn) $.audioBtn.style.display = "";
        if ($.audioLabel) {
          $.audioLabel.textContent = activeLang ? langLabel(activeLang) : "Audio";
        }

        var html = [
          '<div style="padding:.5rem 1rem .35rem;font-size:.62rem;font-weight:700;' +
          'color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px">' +
          'Audio Language</div>'
        ];
        for (var j = 0; j < langs.length; j++) {
          var item = langs[j];
          var selected = item.language === activeLang ? " selected" : "";
          html.push(
            '<div class="audio-menu-item' + selected + '" data-lang="' +
            escapeHtml(item.language) + '">' + escapeHtml(langLabel(item.language)) + '</div>'
          );
        }
        if ($.audioMenu) $.audioMenu.innerHTML = html.join("");
      }

      function closeAudioMenu() {
        if ($.audioMenu) $.audioMenu.classList.remove("active");
      }

      function toggleAudioMenu() {
        if (!$.audioMenu) return;
        if ($.audioMenu.classList.contains("active")) {
          closeAudioMenu();
        } else {
          updateAudioMenu();
          $.audioMenu.classList.add("active");
          showUI();
        }
      }

      /* ── Load channel with fallback URLs ───────────────────────────────── */
      function tryLoad(player, urls) {
        var idx = 0;
        function attempt() {
          if (idx >= urls.length) return Promise.resolve(false);
          return player.load(urls[idx++]).then(function () {
            return true;
          }).catch(attempt);
        }
        return attempt();
      }

      /* ── DRM configuration helper ──────────────────────────────────────── */
      function applyDrmAndCookies(player, channel, cookie) {
        player.getNetworkingEngine().registerRequestFilter(function (type, request) {
          request.headers.Referer = "https://www.jiotv.com/";
          request.headers["User-Agent"] = "plaYtv/7.1.5";
          if (cookie && (type === 0 || type === 1)) {
            request.uris[0] = request.uris[0].split("?")[0] + "?" + cookie;
          }
        });

        var keyId = channel.keyId && channel.keyId !== "null" ? channel.keyId.trim() : null;
        var key = channel.key && channel.key !== "null" ? channel.key.trim() : null;
        if (keyId && key) {
          var clearKeys = {};
          clearKeys[keyId] = key;
          player.configure({ drm: { clearKeys: clearKeys } });
        }
      }

      /* ── PiP hover preview ─────────────────────────────────────────────── */
      function startPipPreview(channel) {
        if (isBusy || window.innerWidth < 768) return;
        if (pipTimer) clearTimeout(pipTimer);

        pipTimer = setTimeout(function () {
          if (!$.pipPreview || !$.pipVideo) return;
          $.pipPreview.style.display = "block";

          window.__RIPPLE_SHAKA__.acquire().then(function (shaka) {
            shaka.polyfill.installAll();

            if (pipPlayer) {
              try { pipPlayer.destroy(); } catch (e) {}
              pipPlayer = null;
            }

            pipPlayer = new shaka.Player($.pipVideo);
            pipPlayer.configure({ preferredAudioLanguage: "te" });

            fetchCookies().then(function (cookie) {
              applyDrmAndCookies(pipPlayer, channel, cookie);
              var urls = [channel.url, channel.url1, channel.url2].filter(Boolean);

              tryLoad(pipPlayer, urls).then(function (ok) {
                if (ok) {
                  $.pipVideo.play().catch(function () {
                    $.pipVideo.muted = true;
                    $.pipVideo.play();
                  });
                } else {
                  stopPipPreview();
                }
              });
            });
          }).catch(function () {
            stopPipPreview();
          });
        }, PIP_DELAY);
      }

      function stopPipPreview() {
        if (pipTimer) { clearTimeout(pipTimer); pipTimer = null; }
        if ($.pipPreview) $.pipPreview.style.display = "none";
        if ($.pipVideo) {
          $.pipVideo.pause();
          $.pipVideo.removeAttribute("src");
          $.pipVideo.load();
        }
        if (pipPlayer) {
          var p = pipPlayer;
          pipPlayer = null;
          try {
            p.destroy().then(function () {
              window.__RIPPLE_SHAKA__.release();
            });
          } catch (e) {
            window.__RIPPLE_SHAKA__.release();
          }
        }
      }

      /* ── Open player ───────────────────────────────────────────────────── */
      function openPlayer(channel) {
        if (isBusy) return;
        isBusy = true;
        currentChannel = channel;
        var session = ++playerSession;

        stopPipPreview();
        $.p.classList.add("active");
        addToHistory(channel);
        showUI();
        if ($.audioBtn) $.audioBtn.style.display = "none";
        closeAudioMenu();

        window.__RIPPLE_SHAKA__.acquire().then(function (shaka) {
          if (session !== playerSession) return;
          shaka.polyfill.installAll();

          if (mainPlayer) {
            try { mainPlayer.destroy(); } catch (e) {}
            mainPlayer = null;
          }

          mainPlayer = new shaka.Player($.video);
          mainPlayer.configure({
            preferredAudioLanguage: "te",
            preferredTextLanguage: "en",
            abr: { enabled: true },
            streaming: {
              lowLatencyMode: true,
              rebufferingGoal: 2,
              bufferBehind: 60
            }
          });

          new shaka.ui.Overlay(mainPlayer, $.container, $.video).configure({
            addSeekBar: true,
            addBigPlayButton: true,
            controlPanelElements: [
              "play_pause", "time_and_duration", "spacer", "mute",
              "volume", "quality", "playback_rate", "picture_in_picture", "fullscreen"
            ],
            overflowMenuButtons: ["captions", "quality", "playback_rate", "picture_in_picture"],
            seekBarColors: {
              base: "rgba(255,255,255,0.2)",
              buffered: "rgba(255,255,255,0.4)",
              played: "#8b5cf6"
            }
          });

          try {
            mainPlayer.addEventListener("trackschanged", function () {
              if (session === playerSession) updateAudioMenu();
            });
            mainPlayer.addEventListener("variantchanged", function () {
              if (session === playerSession) updateAudioMenu();
            });
            mainPlayer.addEventListener("adaptation", function () {
              if (session === playerSession) updateAudioMenu();
            });
          } catch (e) {}

          fetchCookies().then(function (cookie) {
            if (session !== playerSession) return;
            applyDrmAndCookies(mainPlayer, channel, cookie);

            var urls = [channel.url, channel.url1, channel.url2, channel.url3].filter(Boolean);

            tryLoad(mainPlayer, urls).then(function (ok) {
              if (session !== playerSession) return;
              if (!ok) throw new Error("All URLs failed");

              $.video.play();

              // Auto-select Telugu audio if available
              setTimeout(function () {
                if (session !== playerSession) return;
                try {
                  var tracks = mainPlayer.getVariantTracks ? mainPlayer.getVariantTracks() : [];
                  for (var i = 0; i < tracks.length; i++) {
                    if (tracks[i].language === "te") {
                      try { mainPlayer.selectAudioLanguage("te"); } catch (e) {}
                      break;
                    }
                  }
                } catch (e) {}
                updateAudioMenu();
              }, 300);

              setTimeout(function () {
                if (session === playerSession) updateAudioMenu();
              }, 1500);

              isBusy = false;
              showUI();
            });
          });
        }).catch(function () {
          if (session !== playerSession) return;
          isBusy = false;
          if (mainPlayer) {
            try { mainPlayer.destroy(); } catch (e) {}
            mainPlayer = null;
            window.__RIPPLE_SHAKA__.release();
          }
          lastErrorChannel = channel;
          $.e.classList.add("active");
        });
      }

      /* ── Close player ──────────────────────────────────────────────────── */
      function closePlayer() {
        playerSession++;
        $.p.classList.remove("active");
        $.e.classList.remove("active");
        closeAudioMenu();
        isBusy = false;

        if ($.audioBtn) $.audioBtn.style.display = "none";

        if (mainPlayer) {
          var p = mainPlayer;
          mainPlayer = null;
          try {
            p.destroy().then(function () {
              window.__RIPPLE_SHAKA__.release();
            });
          } catch (e) {
            window.__RIPPLE_SHAKA__.release();
          }
        }

        if ($.video) {
          $.video.pause();
          $.video.removeAttribute("src");
          $.video.load();
        }

        clearUiTimer();
        if ($.pu) $.pu.classList.remove("hide");
        window.__RIPPLE_SHAKA__.scheduleUnload();
      }

      /* ── Event bindings ────────────────────────────────────────────────── */
      function bindEvents() {
        /* Grid & history clicks / hovers */
        $.g.addEventListener("click", function (e) {
          var card = e.target.closest(".channel-card");
          if (!card) return;
          var ch = findChannel(card.getAttribute("data-id"));
          if (ch) openPlayer(ch);
        });
        $.g.addEventListener("mouseover", function (e) {
          var card = e.target.closest(".channel-card");
          if (!card) return;
          var ch = findChannel(card.getAttribute("data-id"));
          if (ch) startPipPreview(ch);
        });
        $.g.addEventListener("mouseout", function (e) {
          if (e.target.closest(".channel-card")) stopPipPreview();
        });

        $.hg.addEventListener("click", function (e) {
          var card = e.target.closest(".channel-card");
          if (!card) return;
          var ch = findChannel(card.getAttribute("data-id"));
          if (ch) openPlayer(ch);
        });
        $.hg.addEventListener("mouseover", function (e) {
          var card = e.target.closest(".channel-card");
          if (!card) return;
          var ch = findChannel(card.getAttribute("data-id"));
          if (ch) startPipPreview(ch);
        });
        $.hg.addEventListener("mouseout", function (e) {
          if (e.target.closest(".channel-card")) stopPipPreview();
        });

        /* Category chips */
        $.c.addEventListener("click", function (e) {
          var chip = e.target.closest(".cat-chip");
          if (!chip) return;
          activeCategory = chip.getAttribute("data-cat");
          var chips = $.c.querySelectorAll(".cat-chip");
          for (var i = 0; i < chips.length; i++) {
            chips[i].classList.toggle("active",
              chips[i].getAttribute("data-cat") === activeCategory);
          }
          applyFilters();
        });

        /* Search */
        $.s.addEventListener("input", function () {
          if (searchTimer) clearTimeout(searchTimer);
          searchTimer = setTimeout(function () {
            searchQuery = $.s.value;
            applyFilters();
          }, SEARCH_DEBOUNCE);
        });

        /* Retry */
        $.r.addEventListener("click", function () {
          $.e.classList.remove("active");
          if (lastErrorChannel) openPlayer(lastErrorChannel);
        });

        /* Audio button & menu */
        if ($.audioBtn) {
          $.audioBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            toggleAudioMenu();
          });
        }
        if ($.audioMenu) {
          $.audioMenu.addEventListener("click", function (e) {
            e.stopPropagation();
            var item = e.target.closest(".audio-menu-item");
            if (!item) return;
            var lang = item.getAttribute("data-lang");
            if (lang && mainPlayer) {
              try { mainPlayer.selectAudioLanguage(lang); } catch (err) {}
              setTimeout(updateAudioMenu, 150);
            }
            closeAudioMenu();
          });
        }
        document.addEventListener("click", function (e) {
          if ($.audioMenu && $.audioMenu.classList.contains("active")) {
            if ((!$.audioBtn || !$.audioBtn.contains(e.target)) &&
                !$.audioMenu.contains(e.target)) {
              closeAudioMenu();
            }
          }
        });

        /* Player UI show/hide */
        $.container.addEventListener("mousemove", showUI, { passive: true });
        $.container.addEventListener("click", showUI, { passive: true });
        $.container.addEventListener("touchstart", showUI, { passive: true });

        var moveRaf = null;
        document.addEventListener("mousemove", function () {
          if (!moveRaf) {
            moveRaf = requestAnimationFrame(function () {
              moveRaf = null;
              if ($.p && $.p.classList.contains("active")) showUI();
            });
          }
        }, { passive: true });

        /* Escape key */
        document.addEventListener("keydown", function (e) {
          if ($.p && $.p.classList.contains("active")) {
            if (e.key === "Escape") closePlayer();
            else showUI();
          }
        });

        /* Back button */
        $.backBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          closePlayer();
        });

        /* Visibility change */
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            stopPipPreview();
            if (mainPlayer) {
              try { mainPlayer.getMediaElement().pause(); } catch (e) {}
            }
          }
        });

        /* Resize */
        window.addEventListener("resize", function () {
          if (window.innerWidth < 768) stopPipPreview();
        }, { passive: true });

        /* Pagehide cleanup */
        window.addEventListener("pagehide", function () {
          playerSession++;
          if (mainPlayer) {
            try { mainPlayer.destroy(); } catch (e) {}
            mainPlayer = null;
          }
          if (pipPlayer) {
            try { pipPlayer.destroy(); } catch (e) {}
            pipPlayer = null;
          }
          if (observer) observer.disconnect();
        }, { once: true });
      }

      /* ── Mutation observer for player overlay ──────────────────────────── */
      function setupObserver() {
        observer = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i++) {
            if (mutations[i].attributeName === "class") {
              if ($.p.classList.contains("active")) {
                showUI();
              } else {
                clearUiTimer();
                if ($.pu) $.pu.classList.remove("hide");
              }
              break;
            }
          }
        });
        observer.observe($.p, { attributes: true, attributeFilter: ["class"] });
      }

      /* ── Init ──────────────────────────────────────────────────────────── */
      function init() {
        if (isReady) return;
        isReady = true;

        cacheDom();
        bindEvents();
        setupObserver();
        loadChannels();
        fetchCookies();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init, { once: true });
      } else {
        init();
      }

      /* Expose public API */
      window.__ripple = {
        openPlayer: openPlayer,
        closePlayer: closePlayer
      };
    })();
  </script>
</body>
</html>
